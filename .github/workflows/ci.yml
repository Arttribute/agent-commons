name: CI

on:
  push:
    branches:
      - main
      - staging
      - experiment
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI and package release runners use the bundled CPU inference provider.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  # A promotion PR (staging into main) carries the exact commit CI already
  # tested when it was pushed to staging. Reuse that result instead of
  # running the whole suite again before every release.
  scope:
    name: Choose CI checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REF" = "staging" ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=staging&event=push&head_sha=$HEAD_SHA&status=success" --jq '.total_count' || echo 0)
            if [ "${passed:-0}" -gt 0 ]; then
              run=false
              echo "CI already passed for $HEAD_SHA on staging." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and Test
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest

    services:
      payment-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-payment-test
          POSTGRES_DB: arcade_payments
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Locate the Jest cache
        id: jest-cache
        run: echo "dir=$(node -p "require('path').join(require('fs').realpathSync(require('os').tmpdir()), 'jest_' + process.getuid().toString(36))")" >> "$GITHUB_OUTPUT"

      # ts-jest caches every compiled module, keyed by its contents and
      # imports. Starting from the last run's cache recompiles only what
      # changed instead of type-checking the API again in every Jest step.
      - name: Restore the Jest cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.jest-cache.outputs.dir }}
          key: jest-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Test Vercel build selection
        run: node --test scripts/vercel-ignore-build.test.mjs

      - name: Build packages
        run: pnpm --filter './packages/*' run build

      - name: Test packages
        run: pnpm --filter './packages/*' run test --passWithNoTests

      - name: Test Common Courses certificate delivery and course policies
        run: pnpm --filter commons-courses test

      - name: Test unified Common Courses registration and payments
        run: |
          docker run -d --name commonlab-registration-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          trap 'docker rm -f commonlab-registration-mongo' EXIT
          for attempt in $(seq 1 40); do
            if docker exec commonlab-registration-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec commonlab-registration-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 40); do
            if docker exec commonlab-registration-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          MONGODB_TEST_URI='mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true' node --test apps/commons-courses/scripts/course-registration.test.cjs

      # The gateway fronts every /v1/* request and decides what is reachable
      # without a credential, but nothing here used to exercise it — a broken
      # public-route list reached production unnoticed. Staging cannot catch
      # this either: it has no gateway in front of it.
      - name: Test custom project pages
        run: |
          NODE_OPTIONS=--experimental-vm-modules pnpm --filter commons-api exec jest --runInBand --globals='{"ts-jest":{"isolatedModules":true}}' --runTestsByPath src/project-page/static-import.spec.ts src/project-page/project-page.service.spec.ts src/project-page/templates.spec.ts src/code-project/code-project.builder.spec.ts src/code-project/code-project.service.spec.ts
          node --experimental-strip-types --test packages/ui/src/page-bridge.test.mts

      - name: Test API gateway
        run: pnpm --filter commons-api-gateway run test

      - name: Test event registration and verified payments
        env:
          EVENT_REGISTRATION_TEST_DATABASE_URL: postgres://postgres:local-payment-test@127.0.0.1:15432/arcade_payments
        run: |
          NODE_OPTIONS=--experimental-vm-modules pnpm --filter commons-api exec jest --runInBand --globals='{"ts-jest":{"isolatedModules":true}}' --runTestsByPath src/project-page/public-page-chat.service.spec.ts

      # Better Auth rate limits per client address. Identity sits behind
      # CloudFront and a load balancer, and an unresolved address puts every
      # caller in one shared bucket that 429s token minting platform-wide.
      - name: Test premium models and trusted application plan access
        run: NODE_OPTIONS=--experimental-vm-modules pnpm --filter commons-api exec jest --runInBand --globals='{"ts-jest":{"isolatedModules":true}}' --runTestsByPath src/modules/model-provider/model-registry.spec.ts src/modules/model-provider/model-provider.factory.spec.ts src/modules/model-provider/application-model-access.spec.ts src/modules/model-provider/providers/openai.provider.spec.ts src/modules/usage/usage.service.spec.ts

      - name: Test identity client address resolution and signup credit retries
        run: node --experimental-strip-types --test apps/commons-identity/lib/client-ip.test.mjs apps/commons-identity/lib/signup-credits.test.mjs

      - name: Test CommonLab identity reconciliation and replay safety
        env:
          COMMONLAB_RECONCILIATION_TEST_DB: postgres://postgres:local-payment-test@127.0.0.1:15432/arcade_payments
        run: node --test scripts/lib/commonlab-identity.test.mjs

      # Identity has no staging deployment, so these are its only check before
      # production: OAuth, platform keys, and every way to sign in or sign up
      # (Google, email and password, and mixes of the two).
      - name: Test identity sign-in journeys
        run: pnpm --filter commons-identity run test:e2e

      # /login must keep identity's messages ("check your email", errors) when
      # it restarts sign-in, and sign people in after they verify their email.
      - name: Test login flow
        run: node --experimental-strip-types --test apps/commons-app/lib/login-flow.test.mjs apps/commons-app/lib/desktop-request-policy.test.mjs apps/commons-app/lib/desktop-session.test.mjs

      # A failed token refresh must back off instead of retrying on every
      # request; retry storms exhausted identity's rate limit for everyone.
      - name: Test signed-in agent proxy authentication and ownership
        run: node --experimental-vm-modules --test apps/commons-app/lib/agents-proxy.test.mjs

      - name: Test workspace navigation and new chat suggestions
        run: node --experimental-strip-types --test apps/commons-app/lib/workspace-routes.test.mjs apps/commons-app/lib/start-suggestions.test.mjs apps/commons-app/lib/message-preview.test.mjs apps/commons-app/lib/short-time.test.mjs

      # GPT-5 and later reply with content blocks through the Responses API.
      # The chat must render their text; an array once crashed the whole page.
      - name: Test agent reply text
        run: node --experimental-strip-types --test apps/commons-app/lib/message-text.test.mjs

      - name: Test session token refresh backoff
        run: node --experimental-strip-types --test apps/commons-app/lib/token-refresh.test.mjs

      - name: Test appearance preferences and attributable sharing
        run: node --experimental-strip-types --test apps/commons-app/lib/appearance.test.mjs apps/commons-app/lib/referrals.test.mjs

      - name: Test invitation email authorization and delivery retries
        run: node --experimental-vm-modules --test apps/commons-app/lib/referral-email.test.mjs apps/commons-app/lib/referral-server.test.mjs

      - name: Test referral rewards, concurrency and authorization
        env:
          REFERRAL_TEST_DATABASE_URL: postgres://postgres:local-payment-test@127.0.0.1:15432/arcade_payments
          NODE_OPTIONS: --experimental-vm-modules --max-old-space-size=4096
        run: pnpm --filter commons-api exec jest --runInBand credit/referral credit/credit.service.spec.ts credit/credit.controller.spec.ts session/session-visibility.integration.spec.ts session/chat-history-page.spec.ts session/session-suggestions.service.spec.ts tool/tools/common-tool.project.spec.ts agent/model-tool-selection.spec.ts

      - name: Test default model authorization and session inheritance
        env:
          NODE_OPTIONS: --experimental-vm-modules --max-old-space-size=4096
        run: pnpm --filter commons-api exec jest --runInBand modules/model-provider/model-provider.factory.spec.ts modules/usage/usage.service.spec.ts session/session-model-inheritance.spec.ts

      - name: Test staff billing and reporting authorization
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter commons-api exec jest --runInBand operations/operations.controller.spec.ts billing/billing-operations.spec.ts

      - name: Test wallet balance response and network selection
        run: node --experimental-strip-types --test apps/commons-app/lib/wallet-networks.test.mjs

      - name: Test Commons app host bridge and capability catalog
        run: node --experimental-strip-types --test apps/commons-app/components/plugins/plugin-rpc.test.mjs apps/commons-app/components/plugins/plugin-storage.test.mjs apps/commons-app/components/plugins/capabilities.test.mjs

      - name: Test payment authorization and concurrent budgets
        env:
          PAYMENT_TEST_DATABASE_URL: postgres://postgres:local-payment-test@127.0.0.1:15432/arcade_payments
        run: pnpm --filter commons-api exec jest --runInBand 'wallet/payments|modules/x402/x402.guard.spec.ts'

      - name: Test shared agent checkpoint pool
        run: pnpm --filter commons-api exec jest --runInBand agent/checkpoint-store.spec.ts

      - name: Test compute metering and database pool isolation
        env:
          NODE_OPTIONS: --experimental-vm-modules --max-old-space-size=4096
          PAYMENT_TEST_DATABASE_URL: postgres://postgres:local-payment-test@127.0.0.1:15432/arcade_payments
        run: pnpm --filter commons-api exec jest --runInBand computer/compute-metering

      - name: Test Arcade skill assignment contract
        run: pnpm --filter commons-api exec jest --runInBand skill/skill.controller.spec.ts skill/skill.service.spec.ts

      - name: Test Commons app grants, gateway, data and network guards
        run: pnpm --filter commons-api exec jest --runInBand ui-plugin

      - name: Test migrated computer approval proposals in PostgreSQL
        env:
          RESOURCE_UPGRADE_TEST_DATABASE_URL: postgres://postgres:local-payment-test@127.0.0.1:15432/arcade_payments
        run: pnpm --filter commons-api exec jest --runInBand src/computer/resource-upgrade.integration.spec.ts src/tool/tool-key.integration.spec.ts

      # These ran only inside the AWS deploy, after merge. Running them here
      # keeps them as a gate before merge and takes them off the deploy.
      - name: Test Library files, provenance and workflow execution
        # Document generation loads ES modules dynamically, as the API's own
        # `test` script allows.
        env:
          NODE_OPTIONS: --experimental-vm-modules --max-old-space-size=4096
        run: pnpm --filter commons-api exec jest --runInBand src/files/files.service.spec.ts src/files/library.service.spec.ts src/tool/tools/common-tool.library.spec.ts src/provenance/provenance.service.spec.ts src/tool/workflow-executor.service.spec.ts src/tool/workflow-hitl.integration.spec.ts

  # The API build and its contract scripts are independent of the tests
  # above, so they run alongside them.
  api-contracts:
    name: API build and contracts
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Locate the Jest cache
        id: jest-cache
        run: echo "dir=$(node -p "require('path').join(require('fs').realpathSync(require('os').tmpdir()), 'jest_' + process.getuid().toString(36))")" >> "$GITHUB_OUTPUT"

      # ts-jest caches every compiled module, keyed by its contents and
      # imports. Starting from the last run's cache recompiles only what
      # changed instead of type-checking the API again in every Jest step.
      - name: Restore the Jest cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.jest-cache.outputs.dir }}
          key: jest-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build packages
        run: pnpm --filter './packages/*' run build

      - name: Install pinned video tools for real recording checks
        timeout-minutes: 6
        run: |
          # Static build linked from ffmpeg.org, pinned to an immutable release and SHA-256.
          ffmpeg_ci_dir="$RUNNER_TEMP/ffmpeg-ci"
          mkdir -p "$ffmpeg_ci_dir"
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 120 \
            'https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-11-17-12-40/ffmpeg-n9.0.2-57-gd838f9f9ae-linux64-gpl-9.0.tar.xz' \
            --output "$ffmpeg_ci_dir/tools.tar.xz"
          printf '0c1ec0e063d2eae94b6eca4f47e65a3267d3b0081769c5f26e5adc0d95210ed1  %s\n' "$ffmpeg_ci_dir/tools.tar.xz" | sha256sum --check -
          tar -xJf "$ffmpeg_ci_dir/tools.tar.xz" --strip-components=1 -C "$ffmpeg_ci_dir"
          echo "$ffmpeg_ci_dir/bin" >> "$GITHUB_PATH"
          "$ffmpeg_ci_dir/bin/ffmpeg" -version
          "$ffmpeg_ci_dir/bin/ffprobe" -version

      - name: Build API and test session context, model and Python contracts
        run: |
          node apps/commons-desktop/scripts/cloud-python-reliability.mjs
          node apps/commons-desktop/scripts/cloud-python-alpine-reliability.mjs
          pnpm --filter commons-api build
          pnpm --filter commons-api exec jest --runInBand src/modules/auth/rate-limit.guard.spec.ts src/agent/optional-context.spec.ts src/agent/live-turn-steering.spec.ts src/agent/tool-image-context.spec.ts src/agent/blocking-model-callbacks.spec.ts src/agent/run-stream.registry.spec.ts src/agent/run-stream.registry.shared.spec.ts
          pnpm --filter commons-api exec jest --runInBand src/modules/auth/dto/api-key.dto.spec.ts
          NODE_OPTIONS='--experimental-vm-modules --max-old-space-size=4096' pnpm --filter commons-api exec jest --runInBand src/session/session-model-inheritance.spec.ts src/task/task-execution.service.spec.ts src/agent/run-stream.registry.integration.spec.ts
          node apps/commons-api/scripts/video-sampling-reliability.mjs
          node apps/commons-api/scripts/copilot-runtime-reliability.mjs
          pnpm --filter commons-api exec jest --runInBand src/computer/resource-upgrade-policy.spec.ts src/computer/resource-upgrade.service.spec.ts src/computer/computer-upgrade.controller.spec.ts src/computer/compute-metering.service.spec.ts
          node apps/commons-api/scripts/google-tool-transport.mjs
          pnpm --filter commons-api exec jest --runInBand src/modules/model-provider/model-provider.factory.spec.ts src/modules/model-provider/providers/google.provider.spec.ts src/tool/tools/python-analysis.spec.ts src/media/media-model.registry.spec.ts src/media/providers/openai-media.provider.spec.ts src/computer/computer-file-writes.spec.ts src/computer/computer.service.spec.ts src/agent/model-tool-selection.spec.ts src/agent/computed-artifact-completion.spec.ts src/agent/tool-request-timeout.spec.ts src/agent/agent-tools.controller.spec.ts src/files/video-sampling.spec.ts src/audio/audio.service.spec.ts src/oauth/oauth-flow.service.spec.ts src/oauth/oauth-provider.service.spec.ts src/oauth/oauth.controller.spec.ts src/oauth/managed-mcp.service.spec.ts src/tool/connected-apps.controller.spec.ts src/tool/desktop-search.controller.spec.ts src/tool/tool-invocation.service.spec.ts src/tool/digitax-key-request.spec.ts src/media/canvas-context.spec.ts src/media/canvas-viewed-revision.spec.ts
