name: CI

on:
  push:
    branches:
      - main
      - staging
      - experiment
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      payment-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-payment-test
          POSTGRES_DB: arcade_payments
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' run build

      - name: Test packages
        run: pnpm --filter './packages/*' run test --passWithNoTests

      # The gateway fronts every /v1/* request and decides what is reachable
      # without a credential, but nothing here used to exercise it — a broken
      # public-route list reached production unnoticed. Staging cannot catch
      # this either: it has no gateway in front of it.
      - name: Test API gateway
        run: pnpm --filter commons-api-gateway run test

      # Better Auth rate limits per client address. Identity sits behind
      # CloudFront and a load balancer, and an unresolved address puts every
      # caller in one shared bucket that 429s token minting platform-wide.
      - name: Test identity client address resolution
        run: node --experimental-strip-types --test apps/commons-identity/lib/client-ip.test.mjs

      # Identity has no staging deployment, so these are its only check before
      # production: OAuth, platform keys, and every way to sign in or sign up
      # (Google, email and password, and mixes of the two).
      - name: Test identity sign-in journeys
        run: pnpm --filter commons-identity run test:e2e

      # /login must keep identity's messages ("check your email", errors) when
      # it restarts sign-in, and sign people in after they verify their email.
      - name: Test login flow
        run: node --experimental-strip-types --test apps/commons-app/lib/login-flow.test.mjs apps/commons-app/lib/desktop-request-policy.test.mjs apps/commons-app/lib/desktop-session.test.mjs

      # A failed token refresh must back off instead of retrying on every
      # request; retry storms exhausted identity's rate limit for everyone.
      - name: Test session token refresh backoff
        run: node --experimental-strip-types --test apps/commons-app/lib/token-refresh.test.mjs

      - name: Test wallet balance response and network selection
        run: node --experimental-strip-types --test apps/commons-app/lib/wallet-networks.test.mjs

      - name: Test Commons app host bridge and capability catalog
        run: node --experimental-strip-types --test apps/commons-app/components/plugins/plugin-rpc.test.mjs apps/commons-app/components/plugins/plugin-storage.test.mjs apps/commons-app/components/plugins/capabilities.test.mjs

      - name: Test payment authorization and concurrent budgets
        env:
          PAYMENT_TEST_DATABASE_URL: postgres://postgres:local-payment-test@127.0.0.1:15432/arcade_payments
        run: pnpm --filter commons-api exec jest --runInBand 'wallet/payments|modules/x402/x402.guard.spec.ts'

      - name: Test shared agent checkpoint pool
        run: pnpm --filter commons-api exec jest --runInBand agent/checkpoint-store.spec.ts

      - name: Test Arcade skill assignment contract
        run: pnpm --filter commons-api exec jest --runInBand skill/skill.controller.spec.ts skill/skill.service.spec.ts

      - name: Test Commons app grants, gateway, data and network guards
        run: pnpm --filter commons-api exec jest --runInBand ui-plugin

      - name: Test migrated computer approval proposals in PostgreSQL
        env:
          RESOURCE_UPGRADE_TEST_DATABASE_URL: postgres://postgres:local-payment-test@127.0.0.1:15432/arcade_payments
        run: pnpm --filter commons-api exec jest --runInBand src/computer/resource-upgrade.integration.spec.ts

      - name: Build API and test session context, model and Python contracts
        run: |
          node apps/commons-desktop/scripts/cloud-python-reliability.mjs
          node apps/commons-desktop/scripts/cloud-python-alpine-reliability.mjs
          pnpm --filter commons-api build
          pnpm --filter commons-api exec jest --runInBand src/computer/resource-upgrade-policy.spec.ts src/computer/resource-upgrade.service.spec.ts src/computer/computer-upgrade.controller.spec.ts src/computer/compute-metering.service.spec.ts
          node apps/commons-api/scripts/google-tool-transport.mjs
          pnpm --filter commons-api exec jest --runInBand src/modules/model-provider/model-provider.factory.spec.ts src/modules/model-provider/providers/google.provider.spec.ts src/tool/tools/python-analysis.spec.ts src/computer/computer-file-writes.spec.ts src/computer/computer.service.spec.ts src/agent/model-tool-selection.spec.ts src/agent/computed-artifact-completion.spec.ts src/audio/audio.service.spec.ts src/oauth/oauth-flow.service.spec.ts src/oauth/oauth-provider.service.spec.ts src/oauth/oauth.controller.spec.ts src/oauth/managed-mcp.service.spec.ts src/tool/connected-apps.controller.spec.ts src/tool/desktop-search.controller.spec.ts src/tool/tool-invocation.service.spec.ts src/media/canvas-context.spec.ts src/media/canvas-viewed-revision.spec.ts
