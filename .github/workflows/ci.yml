name: CI

on:
  push:
    branches:
      - main
      - staging
      - experiment
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      payment-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-payment-test
          POSTGRES_DB: arcade_payments
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/*' run build

      - name: Test packages
        run: pnpm --filter './packages/*' run test --passWithNoTests

      # The gateway fronts every /v1/* request and decides what is reachable
      # without a credential, but nothing here used to exercise it — a broken
      # public-route list reached production unnoticed. Staging cannot catch
      # this either: it has no gateway in front of it.
      - name: Test API gateway
        run: pnpm --filter commons-api-gateway run test

      - name: Test payment authorization and concurrent budgets
        env:
          PAYMENT_TEST_DATABASE_URL: postgres://postgres:local-payment-test@127.0.0.1:15432/arcade_payments
        run: pnpm --filter commons-api exec jest --runInBand 'wallet/payments|modules/x402/x402.guard.spec.ts'
