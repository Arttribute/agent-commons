name: Promotion

# Production deploys from main, so main only accepts the staging branch.
# Every change lands on staging first and is verified there; promoting
# staging to main is the release. Branch protection requires this check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  staging-only:
    name: Main only accepts staging
    runs-on: ubuntu-latest
    steps:
      - name: Require staging from this repository as the source
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "staging" ] || [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
            echo "::error::Pull requests into main must come from the staging branch. Retarget this PR to staging, verify it on staging.agentcommons.io, then promote staging to main (see AGENTS.md)."
            exit 1
          fi
          echo "Promoting staging to main."
