name: Repair desktop release assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Desktop workflow run containing the macOS artifact
        required: true
        type: string
      tag:
        description: Existing desktop release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  upload-intel-mac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: desktop-macOS
          path: desktop
      - name: Upload the Intel macOS installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == desktop-v* ]]
          find desktop -type f -print
          dmg=$(find desktop -type f -name 'Agent-Commons-mac-x64.dmg' -print -quit)
          zip=$(find desktop -type f -name 'Agent-Commons-mac-x64.zip' -print -quit)
          test -n "$dmg"
          test -n "$zip"
          cp "$dmg" .
          cp "$zip" .
          gh release upload "$RELEASE_TAG" Agent-Commons-mac-x64.dmg Agent-Commons-mac-x64.zip --clobber
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir .
          sha256sum Agent-Commons-mac-x64.dmg Agent-Commons-mac-x64.zip >> SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
