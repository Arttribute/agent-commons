name: Repair desktop release assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Desktop workflow run containing the macOS artifact
        required: true
        type: string
      tag:
        description: Existing desktop release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  upload-intel-mac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: desktop-macOS
          path: desktop
      - name: Upload missing macOS assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == desktop-v* ]]
          find desktop -type f -print
          assets=(
            Agent-Commons-mac-x64.dmg
            Agent-Commons-mac-x64.zip
            Agent-Commons-mac-x64.dmg.blockmap
            Agent-Commons-mac-x64.zip.blockmap
            Agent-Commons-mac-arm64.dmg.blockmap
            Agent-Commons-mac-arm64.zip.blockmap
            latest-mac.yml
          )
          for asset in "${assets[@]}"; do
            test -f "desktop/$asset"
            cp "desktop/$asset" .
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir .
          sha256sum "${assets[@]}" >> SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
