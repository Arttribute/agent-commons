name: Desktop upgrade repro

# Temporary: reproduces "Cannot find module 'styled-jsx/package.json'" reported
# on real Windows PCs with 0.4.4, which a fresh CI install does not show.

on:
  pull_request:
    paths:
      - .github/workflows/desktop-upgrade-repro.yml

permissions:
  contents: read

jobs:
  upgrade:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 0.4.2 then 0.4.4, no time limit
            from: "0.4.2"
            run_old: "false"
            clean: "false"
          - name: 0.4.2, delete install folder, then 0.4.4
            from: "0.4.2"
            run_old: "true"
            clean: "true"
    steps:
      - name: Install, upgrade and start the bundled server
        shell: pwsh
        env:
          FROM: ${{ matrix.from }}
          RUN_OLD: ${{ matrix.run_old }}
          CLEAN: ${{ matrix.clean }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'https://github.com/Arttribute/agent-commons/releases/download'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\commons-desktop'
          $bundle = Join-Path $dir 'resources\commons-app'

          function Get-Installer($version) {
            $file = Join-Path $env:RUNNER_TEMP "Agent-Commons-$version.exe"
            curl.exe -sSfL -o $file "$root/desktop-v$version/Agent-Commons-win-x64.exe"
            return $file
          }
          function Install($version) {
            $installer = Get-Installer $version
            $started = Get-Date
            $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            "Installed $version (exit $($process.ExitCode), $([int]((Get-Date) - $started).TotalSeconds)s)"
          }
          function Show-Bundle($label) {
            "--- $label"
            "Version: " + (Get-Item "$dir\Agent Commons.exe").VersionInfo.ProductVersion
            foreach ($p in 'node_modules\styled-jsx\package.json','node_modules\next\package.json','apps\commons-app\server.js','apps\commons-app\node_modules','node_modules\.pnpm') {
              "{0,-40} {1}" -f $p, (Test-Path (Join-Path $bundle $p))
            }
            "Files in bundle: " + (Get-ChildItem $bundle -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
          }

          if ($env:FROM) {
            Install $env:FROM
            Show-Bundle "after installing $env:FROM"
            if ($env:RUN_OLD -eq 'true') {
              Start-Process -FilePath "$dir\Agent Commons.exe" | Out-Null
              Start-Sleep -Seconds 25
              "Running before upgrade: " + ((Get-Process | Where-Object { $_.Path -like "$dir*" } | ForEach-Object { "$($_.Id) $($_.ProcessName)" }) -join ', ')
            }
          }
          if ($env:CLEAN -eq 'true') {
            # The remedy for broken installs: stop the app and remove the
            # install folder with a long-path-safe delete, then install fresh.
            Get-Process | Where-Object { $_.Path -like "$dir*" } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
            $started = Get-Date
            cmd /c rd /s /q "\\?\$dir"
            "Removed install folder: $(-not (Test-Path $dir)) ($([int]((Get-Date) - $started).TotalSeconds)s)"
          }
          Install '0.4.4'
          Show-Bundle 'after installing 0.4.4'
          "Running after upgrade: " + ((Get-Process | Where-Object { $_.Path -like "$dir*" } | ForEach-Object { "$($_.Id) $($_.ProcessName)" }) -join ', ')
          Get-Process | Where-Object { $_.Path -like "$dir*" } | Stop-Process -Force -ErrorAction SilentlyContinue

          # Start the bundled server the way the desktop app does.
          $app = Join-Path $bundle 'apps\commons-app'
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:NODE_ENV = 'production'
          $env:COMMONS_DESKTOP_SERVER = '1'
          $env:PORT = '3999'
          $env:HOSTNAME = 'localhost'
          $env:AUTH_URL = 'http://localhost:3999'
          $env:AUTH_SECRET = 'repro-secret-repro-secret-repro-secret-1234'
          $out = Join-Path $env:RUNNER_TEMP 'server.out'
          $err = Join-Path $env:RUNNER_TEMP 'server.err'
          $server = Start-Process -FilePath "$dir\Agent Commons.exe" -ArgumentList "`"$app\server.js`"" -WorkingDirectory $app -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $server.HasExited; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://localhost:3999/desktop/auth'; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          "--- server stderr"; Get-Content $err -Tail 25 -ErrorAction SilentlyContinue
          if ($ok) { "RESULT: bundled server started" } else { throw "RESULT: bundled server did not start" }
