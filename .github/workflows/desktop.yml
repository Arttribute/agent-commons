name: Desktop

on:
  pull_request:
    paths:
      - apps/commons-desktop/**
      - apps/commons-app/**
      - packages/commons-desktop-contract/**
      - packages/commons-agent-core/**
      - packages/agc-cli/src/local-tools.ts
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  push:
    branches: [main, staging]
    tags: ["desktop-v*"]
    paths:
      - apps/commons-desktop/**
      - apps/commons-app/**
      - packages/commons-desktop-contract/**
      - packages/commons-agent-core/**
      - packages/agc-cli/src/local-tools.ts
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  workflow_dispatch:
    inputs:
      local_image_inference:
        description: Generate an image with the verified local Q4 model on Windows and Linux
        type: boolean
        default: false
      local_speech_inference:
        description: Generate and transcribe local speech on Windows and Linux
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    env:
      MAC_SIGNING_ENABLED: ${{ secrets.MAC_CSC_LINK != '' }}
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WIN_CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-commons/desktop-contract typecheck
      - run: pnpm --filter @agent-commons/agent-core test
      - run: pnpm --filter @agent-commons/sdk build
      - run: pnpm --filter @agent-commons/cli typecheck
      - run: pnpm --filter commons-desktop typecheck
      - run: pnpm --filter commons-desktop test
      - name: Verify local image runtime on Windows and Linux
        if: runner.os == 'Windows' || runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          pnpm --filter commons-desktop exec tsup src/local-image.ts --format cjs --platform node --out-dir .image-smoke --no-splitting
          node apps/commons-desktop/scripts/smoke-image-runtime.mjs
      - name: Generate a local image on Windows and Linux
        if: github.event_name == 'workflow_dispatch' && inputs.local_image_inference && (runner.os == 'Windows' || runner.os == 'Linux')
        timeout-minutes: 20
        run: |
          pnpm --filter commons-desktop exec tsup src/local-image.ts --format cjs --platform node --out-dir .image-smoke --no-splitting
          node apps/commons-desktop/scripts/smoke-image-inference.mjs
      - name: Generate and transcribe local speech on Windows and Linux
        if: github.event_name == 'workflow_dispatch' && inputs.local_speech_inference && (runner.os == 'Windows' || runner.os == 'Linux')
        timeout-minutes: 20
        run: |
          pnpm --filter commons-desktop exec tsup src/local-voice.ts src/local-transcription.ts --format cjs --platform node --out-dir .speech-smoke --no-splitting
          node apps/commons-desktop/scripts/smoke-speech-inference.mjs
      - run: pnpm --filter commons-desktop build:commons-app
      - run: pnpm --filter commons-desktop build
      - name: Smoke test unified desktop (Linux)
        if: runner.os == 'Linux'
        # GitHub's runner cannot set Electron's root-owned SUID sandbox helper.
        # BrowserWindow sandboxing remains enabled in the app; this flag is
        # limited to the disposable CI process under Xvfb.
        run: xvfb-run -a pnpm --filter commons-desktop smoke
      - name: Smoke test unified desktop (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm --filter commons-desktop smoke
      - name: Package signed macOS release
        if: runner.os == 'macOS' && env.MAC_SIGNING_ENABLED == 'true'
        run: pnpm --filter commons-desktop exec electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package unsigned macOS release
        if: runner.os == 'macOS' && env.MAC_SIGNING_ENABLED != 'true'
        run: pnpm --filter commons-desktop exec electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MAC_ADHOC_SIGN: true
      - name: Package signed Windows release
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        run: pnpm --filter commons-desktop exec electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Package unsigned Windows release
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED != 'true'
        run: pnpm --filter commons-desktop exec electron-builder --win --publish never
      - name: Package Linux
        if: runner.os == 'Linux'
        run: pnpm --filter commons-desktop exec electron-builder --linux --publish never
      - name: Smoke test packaged macOS desktop
        if: runner.os == 'macOS'
        timeout-minutes: 4
        run: |
          desktop_arch="$(uname -m)"
          desktop_dir="mac"
          if [ "$desktop_arch" = "arm64" ]; then desktop_dir="mac-arm64"; fi
          echo "Testing the $desktop_dir package on $desktop_arch"
          COMMONS_DESKTOP_SMOKE_EXECUTABLE="$PWD/apps/commons-desktop/release/$desktop_dir/Agent Commons.app/Contents/MacOS/Agent Commons" pnpm --filter commons-desktop smoke
      - name: Smoke test packaged Windows desktop
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        run: |
          $env:COMMONS_DESKTOP_SMOKE_EXECUTABLE = Join-Path (Get-Location).Path 'apps/commons-desktop/release/win-unpacked/Agent Commons.exe'
          pnpm --filter commons-desktop smoke
      - name: Smoke test packaged Linux desktop
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          desktop_executable="$PWD/apps/commons-desktop/release/linux-unpacked/agent-commons"
          test -x "$desktop_executable"
          COMMONS_DESKTOP_SMOKE_EXECUTABLE="$desktop_executable" xvfb-run -a pnpm --filter commons-desktop smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/commons-desktop/release/*.dmg
            apps/commons-desktop/release/*.zip
            apps/commons-desktop/release/*.exe
            apps/commons-desktop/release/*.AppImage
            apps/commons-desktop/release/*.yml
            apps/commons-desktop/release/*.blockmap
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false
      - name: Assemble complete release and generate checksums
        run: |
          set -euo pipefail
          mkdir publish
          for platform in desktop-macOS desktop-Windows desktop-Linux; do
            test -d "release-artifacts/$platform"
            while IFS= read -r -d '' asset; do
              name=${asset##*/}
              if [ ! -e "publish/$name" ]; then
                cp "$asset" "publish/$name"
              fi
            done < <(find "release-artifacts/$platform" -type f -print0)
          done
          for installer in \
            Agent-Commons-mac-arm64.dmg \
            Agent-Commons-mac-x64.dmg \
            Agent-Commons-win-x64.exe \
            Agent-Commons-linux-x86_64.AppImage \
            latest-mac.yml latest.yml latest-linux.yml; do
            test -s "publish/$installer"
          done
          cd publish
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: publish/*
          generate_release_notes: true
          body: |
            ## Unified desktop release

            If publisher signing is unavailable, macOS Gatekeeper and Windows
            SmartScreen may show a warning. Verify downloads against the
            SHA256SUMS file before installing.

            Cloud and Private Local use the same Commons interface. Private Local
            keeps its app data and local-model traffic on the user's computer.
            User-approved Local shell commands can use the computer's network.
            Cloud file tools are limited to a selected folder. Full-computer
            commands are off by default and require both a settings change and
            approval for each command. Library files can be copied between
            Cloud and Local through explicit transfer actions.
