name: Desktop

on:
  pull_request:
    paths:
      - apps/commons-desktop/**
      - apps/commons-app/**
      - packages/commons-desktop-contract/**
      - packages/commons-agent-core/**
      - packages/agc-cli/src/local-tools.ts
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  push:
    branches: [main, staging]
    tags: ["desktop-v*"]
    paths:
      - apps/commons-desktop/**
      - apps/commons-app/**
      - packages/commons-desktop-contract/**
      - packages/commons-agent-core/**
      - packages/agc-cli/src/local-tools.ts
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  workflow_dispatch:
    inputs:
      local_image_inference:
        description: Generate an image with the verified local Q4 model on Windows and Linux
        type: boolean
        default: false
      local_speech_inference:
        description: Generate and transcribe local speech on Windows and Linux
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    env:
      MAC_SIGNING_ENABLED: ${{ secrets.MAC_CSC_LINK != '' }}
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WIN_CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The macOS job packages both Apple silicon and Intel apps on an arm64
      # runner. Install x64 native packages too, or the Intel app ships
      # without its own sharp binary. Scoped to CI so arm64 developer
      # machines do not download x64 compilers.
      - name: Install Intel native packages alongside arm64
        if: runner.os == 'macOS'
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.pnpm.supportedArchitectures={os:['current'],cpu:['current','x64']};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-commons/desktop-contract typecheck
      - run: pnpm --filter @agent-commons/agent-core test
      - run: pnpm --filter @agent-commons/sdk build
      - run: pnpm --filter @agent-commons/cli typecheck
      - run: pnpm --filter commons-desktop typecheck
      - run: pnpm --filter commons-desktop test
      - name: Configure Linux Electron sandbox for recording checks
        if: runner.os == 'Linux'
        working-directory: apps/commons-desktop
        run: |
          node -e 'require("electron")'
          sandbox_helper=$(node -p 'require("node:path").join(require("node:path").dirname(require.resolve("electron")), "dist", "chrome-sandbox")')
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"
      - name: Verify workflow capture, audio mixing and account cleanup (Linux)
        env:
          COMMONS_NATIVE_RECORDING_TEST: "true"
        if: runner.os == 'Linux'
        run: xvfb-run -a node apps/commons-desktop/scripts/skill-recording-reliability.mjs
      - name: Verify workflow capture, audio mixing and account cleanup (macOS and Windows)
        env:
          COMMONS_NATIVE_RECORDING_TEST: "true"
        if: runner.os != 'Linux'
        run: node apps/commons-desktop/scripts/skill-recording-reliability.mjs
      - name: Execute managed Python data analysis
        timeout-minutes: 12
        run: node apps/commons-desktop/scripts/python-reliability.mjs
      - name: Verify local image runtime on Windows and Linux
        if: runner.os == 'Windows' || runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          pnpm --filter commons-desktop exec tsup src/local-image.ts --format cjs --platform node --out-dir .image-smoke --no-splitting
          node apps/commons-desktop/scripts/smoke-image-runtime.mjs
      - name: Generate a local image on Windows and Linux
        if: github.event_name == 'workflow_dispatch' && inputs.local_image_inference && (runner.os == 'Windows' || runner.os == 'Linux')
        timeout-minutes: 20
        run: |
          pnpm --filter commons-desktop exec tsup src/local-image.ts --format cjs --platform node --out-dir .image-smoke --no-splitting
          node apps/commons-desktop/scripts/smoke-image-inference.mjs
      - name: Generate and transcribe local speech on Windows and Linux
        if: github.event_name == 'workflow_dispatch' && inputs.local_speech_inference && (runner.os == 'Windows' || runner.os == 'Linux')
        timeout-minutes: 20
        run: |
          pnpm --filter commons-desktop exec tsup src/local-voice.ts src/local-transcription.ts --format cjs --platform node --out-dir .speech-smoke --no-splitting
          node apps/commons-desktop/scripts/smoke-speech-inference.mjs
      - run: pnpm --filter commons-desktop build:commons-app
      - run: pnpm --filter commons-desktop build
      - name: Smoke test unified desktop (Linux)
        if: runner.os == 'Linux'
        # GitHub's runner cannot set Electron's root-owned SUID sandbox helper.
        # BrowserWindow sandboxing remains enabled in the app; this flag is
        # limited to the disposable CI process under Xvfb.
        run: xvfb-run -a pnpm --filter commons-desktop smoke
      - name: Smoke test unified desktop (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm --filter commons-desktop smoke
      - name: Package signed macOS release
        if: runner.os == 'macOS' && env.MAC_SIGNING_ENABLED == 'true'
        run: pnpm --filter commons-desktop exec electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package unsigned macOS release
        if: runner.os == 'macOS' && env.MAC_SIGNING_ENABLED != 'true'
        run: pnpm --filter commons-desktop exec electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MAC_ADHOC_SIGN: true
      - name: Package signed Windows release
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        run: pnpm --filter commons-desktop exec electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Package unsigned Windows release
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED != 'true'
        run: pnpm --filter commons-desktop exec electron-builder --win --publish never
      - name: Package Linux
        if: runner.os == 'Linux'
        run: pnpm --filter commons-desktop exec electron-builder --linux --publish never
      - name: Report installer and installed sizes
        shell: bash
        run: |
          cd apps/commons-desktop/release
          {
            echo "### Desktop size (${{ runner.os }})"
            echo "| Artifact | Size |"
            echo "| --- | --- |"
            for file in *.dmg *.zip *.exe *.AppImage; do
              if [ -f "$file" ]; then echo "| $file (download) | $(( $(wc -c < "$file") / 1048576 )) MB |"; fi
            done
            for dir in mac/*.app mac-arm64/*.app win-unpacked linux-unpacked; do
              if [ -d "$dir" ]; then echo "| $dir (installed) | $(du -sm "$dir" | cut -f1) MB |"; fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Smoke the artifacts users install, not the unpacked build folders.
      # Installers can change the app's files: the Windows NSIS archive
      # turned links into copies, and only the installed app failed to start.
      - name: Smoke test installed macOS desktop
        if: runner.os == 'macOS'
        timeout-minutes: 6
        run: |
          desktop_arch="arm64"
          if [ "$(uname -m)" = "x86_64" ]; then desktop_arch="x64"; fi
          mount="$RUNNER_TEMP/agent-commons-dmg"
          applications="$RUNNER_TEMP/Applications"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "apps/commons-desktop/release/Agent-Commons-mac-$desktop_arch.dmg"
          mkdir -p "$applications"
          ditto "$mount/Agent Commons.app" "$applications/Agent Commons.app"
          hdiutil detach "$mount"
          echo "Testing the $desktop_arch disk image install"
          COMMONS_DESKTOP_SMOKE_EXECUTABLE="$applications/Agent Commons.app/Contents/MacOS/Agent Commons" pnpm --filter commons-desktop smoke
      - name: Smoke test installed Windows desktop
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          $installer = Join-Path (Get-Location).Path 'apps/commons-desktop/release/Agent-Commons-win-x64.exe'
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The Windows installer exited with $($install.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/commons-desktop/Agent Commons.exe'
          if (-not (Test-Path $installed)) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Depth 1 | Format-Table FullName
            throw "Agent Commons was not installed at $installed"
          }
          $env:COMMONS_DESKTOP_SMOKE_EXECUTABLE = $installed
          pnpm --filter commons-desktop smoke
      - name: Smoke test installed Linux desktop
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: |
          appimage="$PWD/apps/commons-desktop/release/Agent-Commons-linux-x86_64.AppImage"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract > /dev/null)
          desktop_executable="$RUNNER_TEMP/squashfs-root/agent-commons"
          test -x "$desktop_executable"
          COMMONS_DESKTOP_SMOKE_EXECUTABLE="$desktop_executable" xvfb-run -a pnpm --filter commons-desktop smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/commons-desktop/release/*.dmg
            apps/commons-desktop/release/*.zip
            apps/commons-desktop/release/*.exe
            apps/commons-desktop/release/*.AppImage
            apps/commons-desktop/release/*.yml
            apps/commons-desktop/release/*.blockmap
          if-no-files-found: warn

  # The macOS build job runs on Apple silicon, so it can only launch the arm64
  # app. Install and launch the Intel disk image on an Intel Mac as well.
  smoke-intel-mac:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macOS
          path: desktop-release
      - name: Smoke test installed Intel macOS desktop
        timeout-minutes: 8
        run: |
          mount="$RUNNER_TEMP/agent-commons-dmg"
          applications="$RUNNER_TEMP/Applications"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" desktop-release/Agent-Commons-mac-x64.dmg
          mkdir -p "$applications"
          ditto "$mount/Agent Commons.app" "$applications/Agent Commons.app"
          hdiutil detach "$mount"
          file "$applications/Agent Commons.app/Contents/MacOS/Agent Commons"
          COMMONS_DESKTOP_SMOKE_EXECUTABLE="$applications/Agent Commons.app/Contents/MacOS/Agent Commons" pnpm --filter commons-desktop smoke

  # Real Windows installs upgrade from older releases, which CI's fresh install
  # never does. 0.4.2 is the last release that shipped the deep pnpm tree, and
  # upgrading over it left Next.js unable to find styled-jsx. Upgrade from it
  # with this build and start the bundled server the way the app does.
  upgrade-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-Windows
          path: desktop-release
      - name: Upgrade from 0.4.2 and start the bundled server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\commons-desktop'
          $bundle = Join-Path $dir 'resources\commons-app'
          $old = Join-Path $env:RUNNER_TEMP 'Agent-Commons-0.4.2.exe'
          curl.exe -sSfL -o $old 'https://github.com/Arttribute/agent-commons/releases/download/desktop-v0.4.2/Agent-Commons-win-x64.exe'
          foreach ($installer in $old, (Resolve-Path 'desktop-release/Agent-Commons-win-x64.exe').Path) {
            $started = Get-Date
            $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$installer exited with $($process.ExitCode)" }
            "Installed $(Split-Path $installer -Leaf) in $([int]((Get-Date) - $started).TotalSeconds)s: $((Get-Item "$dir\Agent Commons.exe").VersionInfo.ProductVersion)"
          }
          if (Test-Path (Join-Path $bundle 'node_modules\.pnpm')) { throw 'The 0.4.2 pnpm tree is still installed' }
          if (-not (Test-Path (Join-Path $bundle 'node_modules\styled-jsx\package.json'))) { throw 'styled-jsx is missing after the upgrade' }

          $app = Join-Path $bundle 'apps\commons-app'
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:NODE_ENV = 'production'
          $env:COMMONS_DESKTOP_SERVER = '1'
          $env:PORT = '3999'
          $env:HOSTNAME = 'localhost'
          $env:AUTH_URL = 'http://localhost:3999'
          $env:AUTH_SECRET = 'upgrade-check-secret-upgrade-check-secret-1'
          $log = Join-Path $env:RUNNER_TEMP 'server.err'
          $server = Start-Process -FilePath "$dir\Agent Commons.exe" -ArgumentList "`"$app\server.js`"" -WorkingDirectory $app -RedirectStandardError $log -PassThru
          $started = $false
          for ($i = 0; $i -lt 60 -and -not $server.HasExited; $i++) {
            try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://localhost:3999/desktop/auth').StatusCode -eq 200) { $started = $true; break } } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          if (-not $started) { Get-Content $log -Tail 25 -ErrorAction SilentlyContinue; throw 'The upgraded Commons app did not start' }
          'The upgraded Commons app started'

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build, smoke-intel-mac, upgrade-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false
      - name: Assemble complete release and generate checksums
        run: |
          set -euo pipefail
          mkdir publish
          for platform in desktop-macOS desktop-Windows desktop-Linux; do
            test -d "release-artifacts/$platform"
            while IFS= read -r -d '' asset; do
              name=${asset##*/}
              if [ ! -e "publish/$name" ]; then
                cp "$asset" "publish/$name"
              fi
            done < <(find "release-artifacts/$platform" -type f -print0)
          done
          for installer in \
            Agent-Commons-mac-arm64.dmg \
            Agent-Commons-mac-x64.dmg \
            Agent-Commons-win-x64.exe \
            Agent-Commons-linux-x86_64.AppImage \
            latest-mac.yml latest.yml latest-linux.yml; do
            test -s "publish/$installer"
          done
          cd publish
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: publish/*
          generate_release_notes: true
          body: |
            ## Unified desktop release

            If publisher signing is unavailable, macOS Gatekeeper and Windows
            SmartScreen may show a warning. Verify downloads against the
            SHA256SUMS file before installing.

            Cloud and Private Local use the same Commons interface. Private Local
            keeps its app data and local-model traffic on the user's computer.
            User-approved Local shell commands can use the computer's network.
            Cloud file tools are limited to a selected folder. Full-computer
            commands are off by default and require both a settings change and
            approval for each command. Library files can be copied between
            Cloud and Local through explicit transfer actions.
