name: Desktop

on:
  pull_request:
    paths:
      - apps/commons-desktop/**
      - apps/commons-app/**
      - packages/commons-desktop-contract/**
      - packages/commons-agent-core/**
      - packages/agc-cli/src/local-tools.ts
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  push:
    branches: [main, staging]
    tags: ["desktop-v*"]
    paths:
      - apps/commons-desktop/**
      - apps/commons-app/**
      - packages/commons-desktop-contract/**
      - packages/commons-agent-core/**
      - packages/agc-cli/src/local-tools.ts
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    env:
      MAC_SIGNING_ENABLED: ${{ secrets.MAC_CSC_LINK != '' }}
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WIN_CSC_LINK != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-commons/desktop-contract typecheck
      - run: pnpm --filter @agent-commons/agent-core test
      - run: pnpm --filter @agent-commons/sdk build
      - run: pnpm --filter @agent-commons/cli typecheck
      - run: pnpm --filter commons-desktop typecheck
      - run: pnpm --filter commons-desktop test
      - run: pnpm --filter commons-desktop build:commons-app
      - run: pnpm --filter commons-desktop build
      - name: Smoke test unified desktop (Linux)
        if: runner.os == 'Linux'
        # GitHub's runner cannot set Electron's root-owned SUID sandbox helper.
        # BrowserWindow sandboxing remains enabled in the app; this flag is
        # limited to the disposable CI process under Xvfb.
        run: xvfb-run -a pnpm --filter commons-desktop smoke
      - name: Smoke test unified desktop (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm --filter commons-desktop smoke
      - name: Package signed macOS release
        if: runner.os == 'macOS' && env.MAC_SIGNING_ENABLED == 'true'
        run: pnpm --filter commons-desktop exec electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package unsigned macOS release
        if: runner.os == 'macOS' && env.MAC_SIGNING_ENABLED != 'true'
        run: pnpm --filter commons-desktop exec electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MAC_ADHOC_SIGN: true
      - name: Package signed Windows release
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        run: pnpm --filter commons-desktop exec electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Package unsigned Windows release
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED != 'true'
        run: pnpm --filter commons-desktop exec electron-builder --win --publish never
      - name: Package Linux
        if: runner.os == 'Linux'
        run: pnpm --filter commons-desktop exec electron-builder --linux --publish never
      - name: Smoke test packaged macOS desktop
        if: runner.os == 'macOS'
        run: |
          desktop_arch="$(node -p 'process.arch')"
          COMMONS_DESKTOP_SMOKE_EXECUTABLE="$PWD/apps/commons-desktop/release/mac-$desktop_arch/Agent Commons.app/Contents/MacOS/Agent Commons" pnpm --filter commons-desktop smoke
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/commons-desktop/release/*.dmg
            apps/commons-desktop/release/*.zip
            apps/commons-desktop/release/*.exe
            apps/commons-desktop/release/*.AppImage
            apps/commons-desktop/release/*.yml
            apps/commons-desktop/release/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Early desktop release

            These installers are currently unsigned while publisher enrollment
            is being completed. macOS Gatekeeper and Windows SmartScreen may
            show a warning. Verify downloads against the SHA256SUMS file before
            installing.

            Private Local keeps conversations, files, tools, knowledge spaces,
            workflows, and local-model traffic on the user's computer.
