name: Release

# Package releases follow the same route as every other change:
# - A push to `staging` with pending changesets bumps the package versions and
#   changelogs and commits them to `staging`.
# - A push to `main` publishes every package version that npm does not have
#   yet, so a version reaches npm only after it has been promoted.
#
# npm authenticates the publish through trusted publishing (OIDC), so there is
# no npm token. Each package lists this workflow as a trusted publisher on
# npmjs.com.

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer staging push versions everything the older one would have. Never
  # cancel a publish halfway.
  cancel-in-progress: ${{ github.ref_name == 'staging' }}

jobs:
  version:
    name: Version packages
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-generate patch changeset when packages changed without one
        shell: bash
        run: |
          EXISTING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$EXISTING" -gt "0" ]; then
            echo "Changesets already present — skipping auto-patch"
            exit 0
          fi

          # Compare with the last merged version PR. Tags are not a reliable
          # base: desktop releases are tagged too, and package tags only
          # appear once main publishes.
          LAST_VERSION=$(git log -1 --format=%H --grep='chore: version packages')
          BASE="${LAST_VERSION:-$(git rev-list --max-parents=0 HEAD)}"
          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD -- packages/ | grep -v 'node_modules' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No package source changes since the last version PR — skipping auto-patch"
            exit 0
          fi

          echo "Package changes detected since ${BASE:0:8} — generating auto patch changeset"

          FRONTMATTER=""
          if echo "$CHANGED_FILES" | grep -q "^packages/commons-sdk/"; then
            FRONTMATTER="${FRONTMATTER}'@agent-commons/sdk': patch"$'\n'
          fi
          if echo "$CHANGED_FILES" | grep -q "^packages/agc-cli/"; then
            FRONTMATTER="${FRONTMATTER}'@agent-commons/cli': patch"$'\n'
          fi

          if [ -z "$FRONTMATTER" ]; then
            echo "No matching packages — skipping changeset"
            exit 0
          fi

          ID=$(openssl rand -hex 4)
          printf -- "---\n%s---\n\nAuto patch release\n" "$FRONTMATTER" > ".changeset/auto-${ID}.md"
          echo "Created .changeset/auto-${ID}.md"

      - name: Commit the version bump to staging
        shell: bash
        env:
          HUSKY: 0
        run: |
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')" ]; then
            echo "No pending changesets — nothing to version"
            exit 0
          fi
          pnpm version-ci
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: version packages"
          git show --stat --format='%s' HEAD
          if ! git push origin HEAD:staging; then
            git fetch origin staging
            if [ "$(git rev-parse origin/staging)" != "$GITHUB_SHA" ]; then
              echo "::notice::staging moved on while versioning. The run for the newer commit versions these packages."
              exit 0
            fi
            exit 1
          fi

  publish:
    name: Publish packages
    # A manual run from another branch only checks trusted publishing.
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later. pnpm publish hands the
      # packed tarball to this npm.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      # npm falls back to token auth when the OIDC exchange fails and then
      # reports a bare 404. Ask npm for each package first so a missing or
      # mismatched trusted publisher fails here with npm's reason. The
      # exchanged tokens are never printed.
      - name: Check npm trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          id_token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          failed=0
          for manifest in packages/*/package.json; do
            name=$(jq -r 'select(.private != true) | .name // empty' "$manifest")
            [ -n "$name" ] || continue
            status=$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}")
            # A successful exchange returns a publish token: never print the
            # response, only npm's error message.
            if [ "${status:0:1}" = 2 ]; then
              echo "$name: trusted publishing ok"
            else
              reason=$(jq -r '.message // .error // empty' "$RUNNER_TEMP/exchange.json" 2>/dev/null || true)
              echo "::error::$name: npm rejected trusted publishing (HTTP $status). ${reason:-npm gave no reason}"
              failed=1
            fi
            rm -f "$RUNNER_TEMP/exchange.json"
          done
          if [ "$failed" = 1 ]; then
            echo "On npmjs.com, each package above needs a trusted publisher: GitHub Actions, organization ${GITHUB_REPOSITORY_OWNER}, repository ${GITHUB_REPOSITORY#*/}, workflow release.yml, no environment."
          fi
          exit "$failed"

      - name: Get pnpm store directory
        if: github.ref_name == 'main'
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        if: github.ref_name == 'main'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        if: github.ref_name == 'main'
        run: pnpm install --frozen-lockfile

      # changeset publish tags each release with an annotated tag, which needs
      # a git identity, and ignores a failed tag.
      - name: Configure git for release tags
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # changeset publish skips versions npm already has, so pushes without a
      # new version publish nothing.
      - name: Publish new package versions
        if: github.ref_name == 'main'
        run: pnpm release
        env:
          HUSKY: 0

      - name: Push release tags
        if: github.ref_name == 'main'
        run: git push origin --tags
