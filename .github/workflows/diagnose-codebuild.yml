name: Diagnose AWS CodeBuild

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Full CodeBuild build ID (project:uuid)
        required: true
        type: string
      environment:
        description: GitHub environment whose AWS role can read the build
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      stack_name:
        description: CloudFormation stack to inspect when deployment failed
        required: false
        default: agent-commons-api-service
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    name: Read CodeBuild failure details
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Show build phases and logs
        env:
          BUILD_ID: ${{ inputs.build_id }}
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          set -euo pipefail

          aws codebuild batch-get-builds \
            --ids "$BUILD_ID" \
            --query 'builds[0].{status:buildStatus,currentPhase:currentPhase,startTime:startTime,endTime:endTime,phases:phases[*].{phase:phaseType,status:phaseStatus,durationSeconds:durationInSeconds,contexts:contexts},logs:logs}' \
            --output json

          log_group=$(aws codebuild batch-get-builds \
            --ids "$BUILD_ID" \
            --query 'builds[0].logs.groupName' \
            --output text)
          log_stream=$(aws codebuild batch-get-builds \
            --ids "$BUILD_ID" \
            --query 'builds[0].logs.streamName' \
            --output text)

          if [ -n "$log_group" ] && [ "$log_group" != "None" ] && \
             [ -n "$log_stream" ] && [ "$log_stream" != "None" ]; then
            aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$log_stream" \
              --limit 10000 \
              --query 'events[].message' \
              --output text || echo "CodeBuild phases were readable, but this role cannot read CloudWatch logs."
          fi

      - name: Inspect the failed service through the CodeBuild role
        if: ${{ inputs.stack_name != '' }}
        env:
          BUILD_ID: ${{ inputs.build_id }}
          DIAGNOSTIC_BUCKET: ${{ vars.AWS_SOURCE_BUCKET }}
          STACK_NAME: ${{ inputs.stack_name }}
        run: |
          set -euo pipefail

          project_name=${BUILD_ID%%:*}
          diagnostic_key="agent-commons/diagnostics/service-deployment.json"

          python -m pip install --quiet boto3
          export DIAGNOSTIC_KEY="$diagnostic_key"
          put_url=$(python - <<'PY'
          import os
          import boto3

          print(
              boto3.client("s3").generate_presigned_url(
                  "put_object",
                  Params={
                      "Bucket": os.environ["DIAGNOSTIC_BUCKET"],
                      "Key": os.environ["DIAGNOSTIC_KEY"],
                  },
                  ExpiresIn=900,
              )
          )
          PY
          )
          echo "::add-mask::$put_url"

          printf '{"preflight":true}\n' > /tmp/service-deployment-preflight.json
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H 'Content-Type:' \
            --data-binary @/tmp/service-deployment-preflight.json \
            "$put_url"
          aws s3 cp "s3://${DIAGNOSTIC_BUCKET}/${diagnostic_key}" - >/dev/null

          buildspec=$(cat <<'YAML'
          version: 0.2
          env:
            shell: bash
          phases:
            build:
              commands:
                - |
                  set -euo pipefail
                  python3 - <<'PYDIAG'
                  import json, os, subprocess
                  from pathlib import Path

                  def read(*args):
                      result = subprocess.run(['aws', *args, '--output', 'json'], capture_output=True, text=True)
                      if result.returncode:
                          return {'error': result.stderr.strip()}
                      return json.loads(result.stdout)

                  stack = read('cloudformation', 'describe-stacks', '--stack-name', os.environ['STACK_NAME'], '--query', 'Stacks[0].{status:StackStatus,statusReason:StackStatusReason,outputs:Outputs}')
                  report = {'stack': stack, 'stackEvents': read('cloudformation', 'describe-stack-events', '--stack-name', os.environ['STACK_NAME'], '--query', 'StackEvents[0:60].{resource:LogicalResourceId,status:ResourceStatus,reason:ResourceStatusReason,time:Timestamp}'), 'services': []}
                  for output in stack.get('outputs', []):
                      if not output['OutputKey'].endswith('ServiceArn'):
                          continue
                      arn = output['OutputValue']
                      service = {'arn': arn}
                      service['express'] = read('ecs', 'describe-express-gateway-service', '--service-arn', arn, '--query', 'service.{status:status,currentDeployment:currentDeployment,activeConfigurations:activeConfigurations[*].{status:status}}')
                      service['deployments'] = read('ecs', 'list-service-deployments', '--service', arn, '--max-results', '5', '--query', 'serviceDeployments[*].{status:status,statusReason:statusReason,createdAt:createdAt,targetRevision:targetServiceRevisionArn}')
                      service['details'] = read('ecs', 'describe-services', '--cluster', 'default', '--services', arn, '--query', 'services[0].{name:serviceName,taskDefinition:taskDefinition,running:runningCount,pending:pendingCount,desired:desiredCount,events:events[0:12]}')
                      tasks = read('ecs', 'list-tasks', '--cluster', 'default', '--service-name', arn.rsplit('/', 1)[-1], '--desired-status', 'STOPPED', '--max-results', '5', '--query', 'taskArns')
                      service['stoppedTasks'] = tasks
                      if isinstance(tasks, list) and tasks:
                          service['stoppedTasks'] = read('ecs', 'describe-tasks', '--cluster', 'default', '--tasks', *tasks, '--query', 'tasks[*].{reason:stoppedReason,stopCode:stopCode,containers:containers[*].{name:name,image:image,exitCode:exitCode,reason:reason}}')
                      report['services'].append(service)
                  Path('/tmp/service-deployment.json').write_text(json.dumps(report, indent=2))
                  PYDIAG
                  curl --fail-with-body --silent --show-error -X PUT -H 'Content-Type:' --data-binary @/tmp/service-deployment.json "$DIAGNOSTIC_PUT_URL"
          YAML
          )

          environment_overrides=$(jq -nc \
            --arg putUrl "$put_url" \
            --arg stackName "$STACK_NAME" \
            '[
              {name:"DIAGNOSTIC_PUT_URL", value:$putUrl, type:"PLAINTEXT"},
              {name:"STACK_NAME", value:$stackName, type:"PLAINTEXT"}
            ]')

          diagnostic_build_id=$(aws codebuild start-build \
            --project-name "$project_name" \
            --buildspec-override "$buildspec" \
            --environment-variables-override "$environment_overrides" \
            --query 'build.id' \
            --output text)

          while true; do
            status=$(aws codebuild batch-get-builds \
              --ids "$diagnostic_build_id" \
              --query 'builds[0].buildStatus' \
              --output text)
            case "$status" in
              SUCCEEDED) break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                aws codebuild batch-get-builds \
                  --ids "$diagnostic_build_id" \
                  --query 'builds[0].phases[*].{phase:phaseType,status:phaseStatus,contexts:contexts}' \
                  --output json
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done

          aws s3 cp "s3://${DIAGNOSTIC_BUCKET}/${diagnostic_key}" -
