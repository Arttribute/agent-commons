version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - set -euo pipefail
      - corepack enable && corepack prepare pnpm@9.15.3 --activate
  pre_build:
    commands:
      - set -euo pipefail
      # ENVIRONMENT comes from the CodeBuild project (production | staging).
      # Production keeps the original unsuffixed stack name for continuity.
      - ENVIRONMENT="${ENVIRONMENT:-production}"
      - SERVICE_NAME="agent-commons-api-${ENVIRONMENT}"
      - if [ "$ENVIRONMENT" = "production" ]; then STACK_NAME="agent-commons-api-service"; else STACK_NAME="agent-commons-api-service-${ENVIRONMENT}"; fi
      - MAX_TASKS="${MAX_TASKS:-4}"
      - if [ -z "${WEB_SEARCH_PROVIDER:-}" ]; then WEB_SEARCH_PROVIDER=searxng; fi
      - export WEB_SEARCH_PROVIDER
      - if [ -z "${APP_ORIGIN:-}" ]; then if [ "$ENVIRONMENT" = "production" ]; then APP_ORIGIN=https://www.agentcommons.io; else APP_ORIGIN=https://staging.agentcommons.io; fi; fi
      - export APP_ORIGIN
      - export PUPPETEER_SKIP_DOWNLOAD=true
      - IMAGE_TAG="${ENVIRONMENT}-${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}-${CODEBUILD_BUILD_NUMBER}"
      - IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
      - SEARCH_IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}-search"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
  build:
    commands:
      - pnpm install --filter commons-api... --frozen-lockfile
      - >-
        pnpm --filter commons-api test -- --runInBand --forceExit
        src/provenance/provenance.service.spec.ts
        src/tool/workflow-executor.service.spec.ts
        src/tool/workflow-hitl.integration.spec.ts
      - docker build --platform linux/amd64 -f apps/commons-api/Dockerfile -t "$IMAGE_URI" .
      - docker push "$IMAGE_URI"
      - |
        scan_status=""
        for attempt in $(seq 1 60); do
          # Ask ECR to project the response before it reaches the shell. A full
          # enhanced-scan document can contain thousands of findings and exceed
          # the OS argv limit when passed to jq.
          if ! scan_json=$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query '{status:imageScanStatus.status,description:imageScanStatus.description,critical:imageScanFindings.findingSeverityCounts.CRITICAL}' \
            --output json 2>&1); then
            if grep -Eq 'ScanNotFoundException|ImageNotFoundException' <<<"$scan_json"; then
              sleep 5
              continue
            fi
            printf '%s\n' "$scan_json" >&2
            exit 1
          fi
          scan_status=$(jq -r '.status // empty' <<<"$scan_json")
          if [ "$scan_status" = "COMPLETE" ]; then break; fi
          if [ "$scan_status" = "FAILED" ]; then
            jq -r '.description' <<<"$scan_json" >&2
            exit 1
          fi
          sleep 5
        done
        test "$scan_status" = "COMPLETE"
        critical=$(jq -r '.critical // 0' <<<"$scan_json")
        test "$critical" -eq 0
      - if [ "$WEB_SEARCH_PROVIDER" = "searxng" ]; then docker build --platform linux/amd64 -f infra/searxng/Dockerfile -t "$SEARCH_IMAGE_URI" infra/searxng; fi
      - if [ "$WEB_SEARCH_PROVIDER" = "searxng" ]; then docker push "$SEARCH_IMAGE_URI"; fi
  post_build:
    commands:
      - test "${CODEBUILD_BUILD_SUCCEEDING:-0}" = "1"
      # Apply ordered, ledger-backed migrations before starting code that may
      # depend on them. Break-glass deploys can opt out with RUN_MIGRATIONS=false.
      - |
        if [ "${RUN_MIGRATIONS:-true}" = "true" ]; then
          echo "Running database migrations..."
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$RUNTIME_SECRET_ARN" --query SecretString --output text --region "$AWS_REGION")
          docker run --rm \
            -e POSTGRES_HOST="$(echo "$SECRET_JSON" | jq -r .POSTGRES_HOST)" \
            -e POSTGRES_PORT="$(echo "$SECRET_JSON" | jq -r .POSTGRES_PORT)" \
            -e POSTGRES_DATABASE="$(echo "$SECRET_JSON" | jq -r .POSTGRES_DATABASE)" \
            -e POSTGRES_USER="$(echo "$SECRET_JSON" | jq -r .POSTGRES_USER)" \
            -e POSTGRES_PASSWORD="$(echo "$SECRET_JSON" | jq -r .POSTGRES_PASSWORD)" \
            -e POSTGRES_SSL="$(echo "$SECRET_JSON" | jq -r '.POSTGRES_SSL // "disable"')" \
            --entrypoint node \
            "$IMAGE_URI" scripts/migrate.mjs
        fi
      - trap 'kill "${ALARM_GUARD_PID:-}" 2>/dev/null || true; wait "${ALARM_GUARD_PID:-}" 2>/dev/null || true; infra/aws/set-express-alarm-threshold.sh "$SERVICE_NAME" 1 || true' EXIT
      # Non-fatal: the RollbackAlarm does not exist until the service is first
      # created, so this is a no-op on the very first deploy of an environment.
      - infra/aws/set-express-alarm-threshold.sh "$SERVICE_NAME" 100 || true
      - (while sleep 20; do infra/aws/set-express-alarm-threshold.sh "$SERVICE_NAME" 100 || true; done) & ALARM_GUARD_PID=$!
      - if [ "$WEB_SEARCH_PROVIDER" = "searxng" ]; then SEARCH_SHARED_KEY=$(openssl rand -hex 32); else SEARCH_SHARED_KEY=""; fi
      - >-
        aws cloudformation deploy
        --stack-name "$STACK_NAME"
        --template-file infra/aws/ecs-express-service.yml
        --capabilities CAPABILITY_NAMED_IAM
        --parameter-overrides
        Environment="$ENVIRONMENT"
        MaxTasks="$MAX_TASKS"
        ImageUri="$IMAGE_URI"
        ExecutionRoleArn="$TASK_EXECUTION_ROLE_ARN"
        TaskRoleArn="$TASK_ROLE_ARN"
        InfrastructureRoleArn="$INFRASTRUCTURE_ROLE_ARN"
        RuntimeSecretArn="$RUNTIME_SECRET_ARN"
        AppOrigin="$APP_ORIGIN"
        GoogleOAuthEnabled="${GOOGLE_OAUTH_ENABLED:-false}"
        GitHubOAuthEnabled="${GITHUB_OAUTH_ENABLED:-false}"
        SlackOAuthEnabled="${SLACK_OAUTH_ENABLED:-false}"
        CanvaOAuthEnabled="${CANVA_OAUTH_ENABLED:-false}"
        XOAuthEnabled="${X_OAUTH_ENABLED:-false}"
        AgentCommonsApiUrl="${AGENT_COMMONS_API_URL:-https://api.agentcommons.io}"
        AgentFilesS3Bucket="$AGENT_FILES_S3_BUCKET"
        AgentFilesS3Region="$AGENT_FILES_S3_REGION"
        AgentFilesS3Prefix="$AGENT_FILES_S3_PREFIX"
        CreditUnitsPerUsd="${CREDIT_UNITS_PER_USD:-1000}"
        ModelCostMarkup="${MODEL_COST_MARKUP:-2}"
        AgentRunReservationCredits="${AGENT_RUN_RESERVATION_CREDITS:-1}"
        AgentRunMinimumCredits="${AGENT_RUN_MINIMUM_CREDITS:-1}"
        CreditGiftMin="${CREDIT_GIFT_MIN:-10}"
        CreditGiftDailyLimit="${CREDIT_GIFT_DAILY_LIMIT:-5000}"
        DistributedRateLimitEnabled="${DISTRIBUTED_RATE_LIMIT_ENABLED:-true}"
        WebSearchProvider="${WEB_SEARCH_PROVIDER:-none}"
        SearchImageUri="$SEARCH_IMAGE_URI"
        SearchSharedKey="$SEARCH_SHARED_KEY"
        SearxngSearchCostUsdPerCall="${SEARXNG_SEARCH_COST_USD_PER_CALL:-0}"
        BraveSearchCostUsdPerCall="${BRAVE_SEARCH_COST_USD_PER_CALL:-0.005}"
        OpenAiTranscriptionCostUsdPerMinute="${OPENAI_TRANSCRIPTION_COST_USD_PER_MINUTE:-0.003}"
        OpenAiTtsCostUsdPer1kCharacters="${OPENAI_TTS_COST_USD_PER_1K_CHARACTERS:-0.015}"
        ElevenLabsTtsCostUsdPer1kCharacters="${ELEVENLABS_TTS_COST_USD_PER_1K_CHARACTERS:-0.10}"
        ProvenanceKitExportEnabled="${PROVENANCEKIT_EXPORT_ENABLED:-false}"
        ProvenanceKitApiUrl="${PROVENANCEKIT_API_URL:-}"
        ProvenanceDefaultMode="${PROVENANCE_DEFAULT_MODE:-metadata}"
        ProvenanceFullCaptureEnabled="${PROVENANCE_FULL_CAPTURE_ENABLED:-true}"
        ProvenanceOnchainEnabled="${PROVENANCE_ONCHAIN_ENABLED:-false}"
        --region "$AWS_REGION"
      - ENDPOINT=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`Endpoint`].OutputValue' --output text --region "$AWS_REGION")
      - ENDPOINT="https://${ENDPOINT#https://}"
      - curl --fail --show-error --silent --retry 18 --retry-delay 10 --retry-all-errors "${ENDPOINT%/}/health" | jq -e '.status == "ok"'
      - |
        if [ "$WEB_SEARCH_PROVIDER" = "searxng" ]; then
          SEARCH_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='SearchEndpoint'].OutputValue" \
            --output text \
            --region "$AWS_REGION")
          curl --fail --show-error --silent --retry 12 --retry-delay 5 \
            --header "X-Agent-Commons-Search-Key: $SEARCH_SHARED_KEY" \
            --get "https://${SEARCH_ENDPOINT%/}/search" \
            --data-urlencode "q=Agent Commons" \
            --data "format=json" |
            jq -e '.results | type == "array"'
        fi
      - kill "$ALARM_GUARD_PID" 2>/dev/null || true
      - wait "$ALARM_GUARD_PID" 2>/dev/null || true
      - infra/aws/set-express-alarm-threshold.sh "$SERVICE_NAME" 1 || true
      - trap - EXIT
      - printf '{"endpoint":"%s","image":"%s","environment":"%s","webSearchProvider":"%s"}\n' "$ENDPOINT" "$IMAGE_URI" "$ENVIRONMENT" "$WEB_SEARCH_PROVIDER" > deployment.json

artifacts:
  files:
    - deployment.json
